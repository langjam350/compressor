# Role of this machine: "host" (one per system) or "follower" (any other unit)
role: host

# Wake word spoken to activate the assistant
wake_word: compressor

# Wake-word detection engine (openWakeWord). When the trained model file
# exists at wake_model_path, streaming on-device detection is used —
# faster and far more reliable than the cloud-STT fallback. Train it once
# via docs/WAKE-WORD-TRAINING.md, drop the .onnx here, restart.
# wake_threshold: detection sensitivity 0-1; lower = more sensitive but
# more false wakes. 0.5 is a good starting point.
wake_model_path: models/compressor.onnx
wake_threshold: 0.5

# Required when role is "follower" — a human-readable name for this unit,
# used to attribute host-side action-log entries and identify this unit
# to the host. Omit (or leave unset) on the host itself — the host does not
# need a unit_name, and setting one here (e.g. copying a follower's name
# verbatim) risks colliding with an actual follower unit of the same name.
# unit_name: Living Room

# Only required when role is "follower" — the Host machine's LAN IP
host_ip: 192.168.1.100
host_port: 8765

# Anthropic API key (https://console.anthropic.com) — only required when
# role is "host". Followers do not hold Anthropic credentials; they send
# queries to the host, which is the only unit that talks to the Anthropic API.
anthropic_api_key: YOUR_ANTHROPIC_API_KEY_HERE

# Tuya IoT devices
# Run `python -m tinytuya wizard` to discover devices and get their keys
tuya:
  devices:
    - name: Living Room Light
      device_id: abc123def456
      local_key: xxxxxxxxxxxx
      ip: 192.168.1.50
      version: 3.3
    - name: Bedroom Fan
      device_id: def789ghi012
      local_key: yyyyyyyyyyyy
      ip: 192.168.1.51
      version: 3.3

# Spotify (https://developer.spotify.com — create an app)
spotify:
  client_id: YOUR_SPOTIFY_CLIENT_ID
  client_secret: YOUR_SPOTIFY_CLIENT_SECRET
  redirect_uri: http://localhost:8888/callback

# Programs openable by voice on THIS machine ("compressor, open brave and
# go to youtube"). Each unit (host or follower) has its own list — a
# command spoken to a follower opens the program on that follower.
# processes: named actions inside the program (the launch argument).
# Unknown processes are learned automatically into programs_learned.yaml
# on first successful use.
programs:
  - name: brave
    launch: brave
    process_name: brave
    aliases: [browser]
    processes:
      youtube: https://youtube.com
  - name: notepad
    launch: notepad
    process_name: notepad
  - name: calculator
    launch: calc
  - name: explorer
    launch: explorer

# Voice-driven coding agent ("compressor" -> "start claude"). Speech is
# routed into a headless coding-agent session on THIS machine and the
# responses are spoken back. Say the wake word ALONE to exit the mode.
# agent/model are the agent-agnostic seam: v1 supports only claude_code
# (requires the Claude Code CLI installed and authenticated).
coding_agent:
  agent: claude_code
  # model: claude-sonnet-5        # optional; agent's default if unset
  default_workdir: C:\path\to\your\project
  workdirs:                       # spoken names for "start claude in <name>"
    myproject: C:\path\to\your\project
  permission_mode: acceptEdits    # never bypassed; edits auto-approved only in scoped dirs
  max_turns: 25
  task_timeout_seconds: 600
